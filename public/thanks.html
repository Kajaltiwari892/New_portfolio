      p { font-size: 15px; line-height: 1.7; color: #766350; }
      a { display: inline-flex; align-items: center; min-height: 48px; margin-top: 20px; padding: 12px 20px; border-radius: 9px; background: #604631; color: #fff9ee; font-size: 14px; text-decoration: none; }
